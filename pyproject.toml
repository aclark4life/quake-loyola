[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quake-loyola"
version = "0.1.0"
description = "Quake 1 map generator for the Loyola University Maryland pedestrian bridge and Knott Hall"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]

[project.scripts]
ql = "quake_loyola.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["I", "F", "B", "ARG"]
ignore = [
    "B008",   # typer.Argument/Option in default — idiomatic Typer pattern
]

[dependency-groups]
dev = ["pytest>=8"]
docs = ["furo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
