name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests
        run: pytest

  compile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: extractions/setup-just@v3

      - name: Cache ericw-tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: ericw-tools-v0.18.1-Linux

      - name: Generate map
        run: just generate

      - name: Compile map (qbsp -> vis -fast -> light)
        run: just compile-fast
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.tools/ericw-tools-v0.18.1-Linux/bin
