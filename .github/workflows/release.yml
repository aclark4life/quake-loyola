name: Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      LD_LIBRARY_PATH: ${{ github.workspace }}/.tools/ericw-tools-v0.18.1-Linux/bin

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: extractions/setup-just@v3

      - name: Cache ericw-tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: ericw-tools-v0.18.1-Linux

      - name: Cache WADs
        uses: actions/cache@v4
        with:
          path: |
            quake101.wad
            ad.wad
          key: wads-quake101-ad

      - name: Download WADs
        run: just setup

      - name: Generate map
        run: just generate

      - name: Install ericw-tools
        run: just install-tools

      - name: qbsp — geometry & BSP tree
        run: .tools/ericw-tools-v0.18.1-Linux/bin/qbsp loyola.map 2>&1 | tee qbsp.log

      - name: vis — full visibility (PVS)
        run: .tools/ericw-tools-v0.18.1-Linux/bin/vis loyola.bsp 2>&1 | tee vis.log

      - name: light — lightmaps
        run: .tools/ericw-tools-v0.18.1-Linux/bin/light loyola.bsp 2>&1 | tee light.log

      - name: Package release archive
        run: zip -j "loyola-${{ github.ref_name }}.zip" loyola.bsp loyola.lit

      - name: Generate release notes
        id: release_notes
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)

          {
            echo "## What's Changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              git log "${PREV_TAG}..${TAG}" --pretty=format:"- %s (%h)" --no-merges
            else
              git log "${TAG}" --pretty=format:"- %s (%h)" --no-merges
            fi
            echo ""
            echo ""

            echo "## Build Metrics"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            [ -f loyola.bsp ] && echo "| loyola.bsp | $(du -h loyola.bsp | cut -f1) |"
            [ -f loyola.lit ] && echo "| loyola.lit | $(du -h loyola.lit | cut -f1) |"
            [ -f "loyola-${TAG}.zip" ] && echo "| release zip | $(du -h "loyola-${TAG}.zip" | cut -f1) |"
            [ -f vis.log ] && echo "| vis leafs | $(grep -oE '[0-9]+ leafs' vis.log | head -1 | grep -oE '[0-9]+') |"
            [ -f vis.log ] && echo "| vis clusters | $(grep -oE '[0-9]+ clusters' vis.log | head -1 | grep -oE '[0-9]+') |"
            [ -f vis.log ] && echo "| vis portals | $(grep -oE '[0-9]+ portals' vis.log | head -1 | grep -oE '[0-9]+') |"
            [ -f vis.log ] && echo "| vis time | $(grep -oE '[0-9.]+ seconds elapsed' vis.log | tail -1 | grep -oE '[0-9.]+') s |"
            echo ""

            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            fi
          } > release_body.md

          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Loyola build — ${{ github.ref_name }}"
            echo ""
            cat release_body.md 2>/dev/null || true
            echo ""
            echo "<details><summary>qbsp log</summary>"
            echo ""
            echo '~~~'
            [ -f qbsp.log ] && cat qbsp.log
            echo '~~~'
            echo "</details>"
            echo ""
            echo "<details><summary>vis log</summary>"
            echo ""
            echo '~~~'
            [ -f vis.log ] && cat vis.log
            echo '~~~'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: loyola-${{ github.ref_name }}.zip
          body_path: release_body.md
          draft: true
