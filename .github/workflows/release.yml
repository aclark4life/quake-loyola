name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: extractions/setup-just@v3

      - name: Cache ericw-tools
        uses: actions/cache@v4
        with:
          path: .tools
          key: ericw-tools-v0.18.1-Linux

      - name: Cache WADs
        uses: actions/cache@v4
        with:
          path: |
            quake101.wad
            ad.wad
          key: wads-quake101-ad

      - name: Download WADs
        run: just setup

      - name: Generate map
        run: just generate

      - name: Compile map (qbsp -> vis -> light)
        run: just compile
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/.tools/ericw-tools-v0.18.1-Linux/bin

      - name: Package release archive
        run: zip -j "loyola-${{ github.ref_name }}.zip" loyola.bsp loyola.lit

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: loyola-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: true
